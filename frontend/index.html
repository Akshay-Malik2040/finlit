<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- App Identity -->
    <title>FinLit — Smart Flatmate Expense &amp; Bill Splitting</title>
    <meta name="description" content="Zero-friction expense tracking for flatmates, trips, and shared households. Split bills, track balances, settle up — no login required." />
    <meta name="application-name" content="FinLit" />

    <!-- Theme & Colors -->
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#059669" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#059669" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS / Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FinLit" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.svg" />

    <!-- Open Graph (for sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="FinLit — Flatmate Expense Splitting" />
    <meta property="og:description" content="Zero-friction expense tracking for flatmates, trips &amp; shared households." />
    <meta property="og:image" content="/icons/icon-512.svg" />

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
